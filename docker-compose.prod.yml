name: oxubiraz-prod

x-registry: &registry ${REGISTRY:-ghcr.io/oxubiraz/oxubiraz}
x-api-tag:  &api-tag  ${API_TAG:-latest}
x-web-tag:  &web-tag  ${WEB_TAG:-latest}

services:
  web:
    image: ${REGISTRY:-ghcr.io/oxubiraz/oxubiraz}/web:${WEB_TAG:-latest}
    container_name: oxubiraz_web_prod
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - oxubiraz_prod_network

  api:
    image: ${REGISTRY:-ghcr.io/oxubiraz/oxubiraz}/api:${API_TAG:-latest}
    container_name: oxubiraz_api_prod
    restart: always
    working_dir: /var/www/html
    env_file: .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - oxubiraz_prod_storage:/var/www/html/storage/app
    networks:
      - oxubiraz_prod_network
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: oxubiraz_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/api:/var/www/html:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    networks:
      - oxubiraz_prod_network

  horizon:
    image: ${REGISTRY:-ghcr.io/oxubiraz/oxubiraz}/horizon:${API_TAG:-latest}
    container_name: oxubiraz_horizon_prod
    restart: always
    working_dir: /var/www/html
    env_file: .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - oxubiraz_prod_storage:/var/www/html/storage/app
      - oxubiraz_horizon_logs:/var/log/supervisor
    stop_grace_period: 60s
    networks:
      - oxubiraz_prod_network

  scheduler:
    image: ${REGISTRY:-ghcr.io/oxubiraz/oxubiraz}/api:${API_TAG:-latest}
    container_name: oxubiraz_scheduler_prod
    restart: always
    working_dir: /var/www/html
    env_file: .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - REDIS_HOST=redis
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - oxubiraz_prod_storage:/var/www/html/storage/app
    networks:
      - oxubiraz_prod_network

  mysql:
    image: mysql:8.0
    container_name: oxubiraz_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - oxubiraz_prod_mysql:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - oxubiraz_prod_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: oxubiraz_redis_prod
    restart: always
    volumes:
      - oxubiraz_prod_redis:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      - oxubiraz_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  certbot:
    image: certbot/certbot
    container_name: oxubiraz_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  oxubiraz_prod_mysql:
  oxubiraz_prod_redis:
  oxubiraz_prod_storage:
  oxubiraz_horizon_logs:
  certbot_www:
  certbot_conf:

networks:
  oxubiraz_prod_network:
    driver: bridge
