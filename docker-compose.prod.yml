name: oxubiraz-prod

services:
  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/web/Dockerfile.prod
    container_name: oxubiraz_web_prod
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - oxubiraz_prod_network
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/php/Dockerfile.prod
    container_name: oxubiraz_api_prod
    restart: always
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - mysql
      - redis
    networks:
      - oxubiraz_prod_network
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: oxubiraz_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/api:/var/www/html:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    networks:
      - oxubiraz_prod_network

  mysql:
    image: mysql:8.0
    container_name: oxubiraz_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - oxubiraz_prod_mysql:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - oxubiraz_prod_network
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.4-alpine
    container_name: oxubiraz_redis_prod
    restart: always
    volumes:
      - oxubiraz_prod_redis:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      - oxubiraz_prod_network

  queue:
    build:
      context: ./apps/api
      dockerfile: ../../docker/php/Dockerfile.prod
    container_name: oxubiraz_queue_prod
    restart: always
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      - mysql
      - redis
    networks:
      - oxubiraz_prod_network

  scheduler:
    build:
      context: ./apps/api
      dockerfile: ../../docker/php/Dockerfile.prod
    container_name: oxubiraz_scheduler_prod
    restart: always
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    depends_on:
      - mysql
      - redis
    networks:
      - oxubiraz_prod_network

  certbot:
    image: certbot/certbot
    container_name: oxubiraz_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  oxubiraz_prod_mysql:
  oxubiraz_prod_redis:
  certbot_www:
  certbot_conf:

networks:
  oxubiraz_prod_network:
    driver: bridge
