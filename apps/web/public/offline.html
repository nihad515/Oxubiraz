<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Oxubiraz</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f9fafb;
      color: #374151;
      text-align: center;
      padding: 1rem;
    }
    .emoji { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { color: #6b7280; max-width: 320px; }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="emoji">📶</div>
  <h1>İnternet bağlantısı yoxdur</h1>
  <p>Zəhmət olmasa internet bağlantınızı yoxlayın və yenidən cəhd edin.</p>
  <button onclick="window.location.reload()">Yenidən cəhd et</button>
</body>
</html>
