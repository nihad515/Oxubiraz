services:
  # ── MySQL ────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: oxubiraz_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-oxubiraz}
      MYSQL_USER: ${DB_USERNAME:-oxubiraz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oxubiraz_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/php/Dockerfile.dev
    container_name: oxubiraz_api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-oxubiraz}
      DB_USERNAME: ${DB_USERNAME:-oxubiraz}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      BROADCAST_DRIVER: pusher
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-}
      PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Queue worker ─────────────────────────────────────────────────────────────
  queue:
    build:
      context: ./apps/api
      dockerfile: ../../docker/php/Dockerfile.dev
    container_name: oxubiraz_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./apps/api:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-oxubiraz}
      DB_USERNAME: ${DB_USERNAME:-oxubiraz}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      BROADCAST_DRIVER: pusher
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY:-}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET:-}
      PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx (API gateway) ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: oxubiraz_nginx
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./apps/api/public:/var/www/html/public:ro
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # ── Next.js web ──────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/web/Dockerfile.dev
    container_name: oxubiraz_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_PUSHER_KEY: ${PUSHER_APP_KEY:-}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${PUSHER_APP_CLUSTER:-mt1}
    depends_on:
      - nginx

volumes:
  db_data:
  redis_data:
