name: oxubiraz

services:
  # ─── Next.js Frontend ───────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: ../../docker/web/Dockerfile.dev
    container_name: oxubiraz_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - api
    networks:
      - oxubiraz_network

  # ─── Laravel API ─────────────────────────────────────────
  api:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.dev
    container_name: oxubiraz_api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - mysql
      - redis
    networks:
      - oxubiraz_network

  # ─── Nginx ───────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: oxubiraz_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./apps/api:/var/www/html
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - oxubiraz_network

  # ─── MySQL ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: oxubiraz_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: oxubiraz
      MYSQL_USER: oxubiraz_user
      MYSQL_PASSWORD: oxubiraz_password
    ports:
      - "3306:3306"
    volumes:
      - oxubiraz_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - oxubiraz_network

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: oxubiraz_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - oxubiraz_redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - oxubiraz_network

  # ─── Mailpit (Dev Email) ──────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: oxubiraz_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - oxubiraz_network

  # ─── Queue Worker ─────────────────────────────────────────
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.dev
    container_name: oxubiraz_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      - mysql
      - redis
    networks:
      - oxubiraz_network

  # ─── Scheduler ────────────────────────────────────────────
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile.dev
    container_name: oxubiraz_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    depends_on:
      - mysql
      - redis
    networks:
      - oxubiraz_network

volumes:
  oxubiraz_mysql_data:
  oxubiraz_redis_data:

networks:
  oxubiraz_network:
    driver: bridge
